name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma:generate

      # The engine validates its config on import, so its tests need the
      # keyless placeholders from .env.example. No test touches the network,
      # Postgres or Redis.
      - run: cp .env.example apps/engine/.env

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @sniperbot/dashboard build
