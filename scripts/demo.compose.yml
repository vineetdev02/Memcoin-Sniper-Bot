# Postgres and Redis for `pnpm demo` only. Separate from docker-compose.yml on
# purpose: no fixed ports, no volumes, and `docker compose down -v` at the end
# deletes everything, so a demo never touches your own paper-trading history.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1::5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sniperbot
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sniperbot"]
      interval: 2s
      timeout: 3s
      retries: 15
